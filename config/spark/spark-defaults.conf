# ==============================================================================
# Spark & Apache Iceberg Configuration
# ==============================================================================

# Enable Iceberg Spark SQL Extensions
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Lakehouse Catalog (Iceberg REST Catalog)
spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type=rest
spark.sql.catalog.lakehouse.uri=http://rest:8181
spark.sql.catalog.lakehouse.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.warehouse=s3://warehouse/
spark.sql.catalog.lakehouse.s3.endpoint=http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access=true
spark.sql.catalog.lakehouse.s3.access-key-id=admin
spark.sql.catalog.lakehouse.s3.secret-access-key=password

# Set default catalog
spark.sql.defaultCatalog=lakehouse

# S3A FileSystem configurations for direct MinIO I/O
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=admin
spark.hadoop.fs.s3a.secret.key=password
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled=false

# Memory & Resource tuning for Docker container (WSL2 8GB host RAM)
spark.driver.memory=2500m
spark.executor.memory=2500m
spark.driver.maxResultSize=1g
spark.sql.shuffle.partitions=16
spark.sql.iceberg.write.distribution-mode=range
spark.sql.iceberg.write.fanout.enabled=false
spark.sql.adaptive.enabled=true

